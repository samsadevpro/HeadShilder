<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeaderShield — HTTP Security Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .macos-window {
            background: rgba(30, 30, 32, 0.85);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        .macos-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .macos-input:focus {
            background: rgba(0, 0, 0, 0.5);
            border-color: rgba(10, 132, 255, 0.6);
            box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
        }
        .macos-primary-btn {
            background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .macos-primary-btn:hover {
            background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%);
        }
    </style>
</head>
<body class="bg-[#121214] text-[#F5F5F7] min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full macos-window rounded-2xl overflow-hidden relative">
        <!-- Barre de titre macOS -->
        <div class="px-4 py-3 flex items-center justify-between border-b border-white/[0.06] bg-white/[0.02]">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 rounded-full bg-[#FF5F56]"></div>
                <div class="w-3 h-3 rounded-full bg-[#FFBD2E]"></div>
                <div class="w-3 h-3 rounded-full bg-[#27C93F]"></div>
            </div>
            <div class="text-xs font-medium text-[#86868B]">HeaderShield — Scanner HTTP</div>
            <div class="w-10"></div>
        </div>

        <div class="p-8 space-y-6">
            <!-- En-tête -->
            <div class="text-center space-y-1">
                <h1 class="text-2xl font-semibold tracking-tight text-white">Audit de Sécurité HTTP</h1>
                <p class="text-xs text-[#86868B]">Analysez les en-têtes de sécurité OWASP de n'importe quel site web.</p>
            </div>

            <!-- Formulaire -->
            <form id="scanForm" class="flex gap-2">
                <input type="text" id="urlInput" placeholder="Entrez une URL (ex: https://example.com)" required
                    class="flex-1 macos-input rounded-xl px-4 py-3 text-sm text-white placeholder-[#86868B] focus:outline-none transition-all">
                <button type="submit" id="submitBtn" class="macos-primary-btn text-white font-medium px-5 py-3 rounded-xl transition-all text-xs tracking-wide shadow-lg">
                    Analyser
                </button>
            </form>

            <!-- Zone de chargement -->
            <div id="loader" class="hidden text-center py-8 text-xs text-[#86868B] space-y-2">
                <div class="w-6 h-6 border-2 border-white/20 border-t-blue-400 rounded-full animate-spin mx-auto"></div>
                <p>Analyse des en-têtes du serveur en cours...</p>
            </div>

            <!-- Résultats -->
            <div id="resultContainer" class="hidden space-y-6">
                <div class="flex items-center justify-between p-4 rounded-xl bg-black/30 border border-white/10">
                    <div>
                        <span class="text-[10px] uppercase font-semibold text-[#86868B] tracking-wider">Note globale</span>
                        <div id="targetUrlText" class="text-xs text-white font-mono mt-0.5 truncate max-w-xs"></div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <span id="scoreText" class="text-sm font-medium text-[#86868B]"></span>
                        <div id="gradeBadge" class="w-12 h-12 rounded-xl flex items-center justify-center text-xl font-bold shadow-inner"></div>
                    </div>
                </div>

                <!-- Liste des en-têtes -->
                <div id="headersList" class="space-y-3 max-h-96 overflow-y-auto pr-1"></div>
            </div>

            <!-- Erreur -->
            <div id="errorContainer" class="hidden p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-300"></div>
        </div>
    </div>

    <script>
        const scanForm = document.getElementById('scanForm');
        const urlInput = document.getElementById('urlInput');
        const loader = document.getElementById('loader');
        const resultContainer = document.getElementById('resultContainer');
        const errorContainer = document.getElementById('errorContainer');
        const headersList = document.getElementById('headersList');
        const gradeBadge = document.getElementById('gradeBadge');
        const scoreText = document.getElementById('scoreText');
        const targetUrlText = document.getElementById('targetUrlText');

        scanForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            errorContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                const data = await response.json();

                loader.classList.add('hidden');

                if (!response.ok) {
                    errorContainer.textContent = data.error || "Une erreur est survenue.";
                    errorContainer.classList.remove('hidden');
                    return;
                }

                targetUrlText.textContent = data.url;
                scoreText.textContent = `${data.scorePercent}% de conformité`;
                
                let gradeColor = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                if (data.grade === 'B') gradeColor = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                if (data.grade === 'C' || data.grade === 'F') gradeColor = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                gradeBadge.className = `w-12 h-12 rounded-xl flex items-center justify-center text-lg font-bold shadow-inner ${gradeColor}`;
                gradeBadge.textContent = data.grade;

                headersList.innerHTML = '';
                for (const [key, info] of Object.entries(data.headers)) {
                    const isPresent = info.value !== null;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = "p-3.5 rounded-xl bg-black/20 border border-white/5 space-y-1.5 text-xs";
                    
                    itemDiv.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="font-medium text-white">${info.name}</span>
                            <span class="px-2 py-0.5 rounded-md font-semibold ${isPresent ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                                ${isPresent ? 'Présent' : 'Absent'}
                            </span>
                        </div>
                        <p class="text-[#86868B]">${info.description}</p>
                        ${!isPresent ? `<div class="text-[11px] text-amber-400 bg-amber-500/5 p-2 rounded-lg border border-amber-500/10 mt-1">💡 ${info.recommendation}</div>` : `<div class="text-[10px] text-emerald-400 font-mono truncate">Valeur : ${info.value}</div>`}
                    `;
                    headersList.appendChild(itemDiv);
                }

                resultContainer.classList.remove('hidden');

            } catch (err) {
                loader.classList.add('hidden');
                errorContainer.textContent = "Erreur de connexion au serveur.";
                errorContainer.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
